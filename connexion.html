<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><main class="main" style="max-width:760px;margin:auto"><div class="card" style="margin-top:7vh"><div class="logo">DIGITAL <span style="color:var(--red)">DZ</span></div><h1>🔐 Votre espace apprenant</h1><p class="muted">Chaque cliente possède son adresse e-mail, son compte et son code d'accès personnel.</p><div class="grid"><div><h2>Se connecter</h2><form class="form" onsubmit="login(event)"><input class="input" id="loginEmail" type="email" placeholder="Adresse e-mail" required><input class="input" id="loginPass" type="password" placeholder="Mot de passe" required><button class="btn">Connexion</button></form></div><div><h2>Créer mon compte</h2><form class="form" onsubmit="signup(event)"><input class="input" id="signName" placeholder="Nom et prénom" required><input class="input" id="signEmail" type="email" placeholder="Adresse e-mail" required><input class="input" id="signPass" type="password" minlength="6" placeholder="Mot de passe (6 caractères min.)" required><button class="btn">Créer mon compte</button></form></div></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><div id="activateBox" class="card" style="background:#f8fbff"><h2>🎫 Activer ma carte PVC</h2><p class="muted">Connectez-vous d'abord, puis saisissez le code imprimé sur votre carte.</p><input class="input" id="accessCode" placeholder="Ex. DZ-XXXX-XXXX"><button class="btn" style="margin-top:10px" onclick="activate()">Activer mon accès</button><div id="result"></div></div><p style="margin-top:20px"><button class="btn secondary" onclick="wa('Bonjour DIGITAL DZ, j’ai besoin d’aide pour accéder à ma formation.')">💬 Besoin d'aide WhatsApp</button></p></div></main><script>
async function login(e){e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPass.value});if(error){result.innerHTML='<div class="notice">❌ '+error.message+'</div>';return}location.href='dashboard.html'}
async function signup(e){e.preventDefault();const {data,error}=await sb.auth.signUp({email:signEmail.value.trim(),password:signPass.value,data:{full_name:signName.value.trim()}});if(error){result.innerHTML='<div class="notice">❌ '+error.message+'</div>';return}result.innerHTML='<div class="notice">✅ Compte créé. Si la confirmation e-mail est activée, confirmez votre adresse puis connectez-vous. Ensuite, activez votre code PVC.</div>'}
async function activate(){try{const u=await user();if(!u){result.innerHTML='<div class="notice">⚠️ Connectez-vous avant d’activer le code.</div>';return}const ok=await activateCode(accessCode.value);if(!ok){result.innerHTML='<div class="notice">❌ Code invalide, déjà utilisé ou désactivé.</div>';return}result.innerHTML='<div class="notice">✅ Accès activé pour '+u.email+'. <a href="dashboard.html"><b>Ouvrir mon espace →</b></a></div>'}catch(e){result.innerHTML='<div class="notice">❌ Activation impossible. Vérifiez que la base Supabase est configurée avec le SQL fourni.</div>'}}
(async()=>{const u=await user();if(u){const p=await profile();if(p?.access_active)location.href='dashboard.html'}})();
</script></body></html>
