<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missions — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="data.js"></script></head><body><script>
(async()=>{const x=await requireAccess();if(!x)return;shell('missions');await fillUser();const u=x.u;const {data}=await sb.from('mission_progress').select('mission_id,done').eq('user_id',u.id);const done=new Set((data||[]).filter(r=>r.done).map(r=>r.mission_id));const titles=DZ_MODULES.map(m=>m.title);document.querySelector('.main').insertAdjacentHTML('beforeend',`<h1>🎯 Missions pratiques</h1><p class="muted">Une mission concrète pour chaque module. Votre progression est liée à votre compte.</p><div class="card"><div class="kpi" id="pct">${Math.round(done.size/28*100)}%</div><div class="progress"><span id="bar" style="width:${done.size/28*100}%"></span></div><p id="count">${done.size}/28 missions terminées</p></div><div class="grid" style="margin-top:15px">${titles.map((t,i)=>`<label class="card"><span class="badge">Mission ${i+1}</span><h3>${t}</h3><p class="muted">Réalisez l'action pratique du module.</p><input type="checkbox" ${done.has(i+1)?'checked':''} onchange="toggle(${i+1},this.checked)"> Mission terminée</label>`).join('')}</div><section id="challenge" class="section"><h2>🔥 Challenge 30 jours</h2><div class="card"><table class="table"><tr><th>Période</th><th>Objectif</th><th>Livrable</th></tr><tr><td>Jours 1–7</td><td>Niche + compétence + offre</td><td>Fiche cible + offre simple</td></tr><tr><td>Jours 8–15</td><td>Créer le premier livrable</td><td>Produit/service + portfolio</td></tr><tr><td>Jours 16–23</td><td>Publier et prospecter</td><td>Contenus + messages</td></tr><tr><td>Jours 24–30</td><td>Mesurer et améliorer</td><td>Tableau KPI + plan d'amélioration</td></tr></table></div></section>`);window.toggle=async(id,v)=>{await sb.from('mission_progress').upsert({user_id:u.id,mission_id:id,done:v},{onConflict:'user_id,mission_id'});const n=document.querySelectorAll('input[type=checkbox]:checked').length,p=Math.round(n/28*100);pct.textContent=p+'%';bar.style.width=p+'%';count.textContent=n+'/28 missions terminées'};closeShell()})();
</script></body></html>
