<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attestation — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>
(async()=>{const x=await requireAccess();if(!x)return;shell('attestation');await fillUser();document.querySelector('.main').insertAdjacentHTML('beforeend',`<div class="card" style="max-width:850px;margin:auto;text-align:center"><span class="badge">DIGITAL DZ</span><h1>🎓 Attestation de progression</h1><p class="muted">Générez une attestation interne lorsque votre parcours est suffisamment avancé.</p><button class="btn" onclick="generate()">Générer mon attestation</button><div id="cert" style="margin-top:20px"></div></div>`);window.generate=async()=>{const n=x.p.full_name||x.u.email;cert.innerHTML=`<div class="card" style="border:3px solid var(--red);padding:40px"><div class="logo">DIGITAL <span style="color:var(--red)">DZ</span></div><h2>ATTESTATION DE PROGRESSION</h2><p>Cette attestation est remise à</p><h2>${n}</h2><p>pour son parcours de formation DIGITAL DZ.</p><p><b>28 modules • 160 tests • missions pratiques</b></p><p class="muted">Attestation interne de progression, non officielle et non assimilable à un diplôme.</p><button class="btn" onclick="window.print()">🖨️ Imprimer / PDF</button></div>`};closeShell()})();
</script></body></html>
