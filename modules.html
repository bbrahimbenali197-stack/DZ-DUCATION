<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28 Modules — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="data.js"></script></head><body><script>
(async()=>{if(!await requireAccess())return;shell('modules');await fillUser();const q=new URLSearchParams(location.search).get('q')||'';document.querySelector('.main').insertAdjacentHTML('beforeend',`<div class="section-head"><div><h1>📚 Les 28 modules</h1><p class="muted">Chaque module contient cours, objectifs, exercice et action pratique.</p></div></div><input id="filter" class="input" placeholder="🔎 Rechercher un module..." value="${q.replace(/"/g,'&quot;')}"><div id="mods" class="grid" style="margin-top:15px"></div>`);function render(){const s=filter.value.toLowerCase();mods.innerHTML=DZ_MODULES.filter(m=>!s||m.title.toLowerCase().includes(s)||m.goal.toLowerCase().includes(s)).map(m=>`<article class="card module"><span class="badge">Module ${m.id}</span><h3>${m.title}</h3><p>${m.goal}</p><button class="btn" onclick="openM(${m.id})">Ouvrir le cours</button></article>`).join('')||'<div class="card">Aucun module trouvé.</div>'}window.openM=id=>{const m=DZ_MODULES.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#07122599;display:grid;place-items:center;padding:18px;z-index:80"><div class="card" style="max-width:900px;max-height:90vh;overflow:auto;position:relative"><button class="btn secondary" style="position:absolute;right:15px;top:15px" onclick="document.getElementById('modal').remove()">Fermer</button><span class="badge">Module ${m.id}</span><h2>${m.title}</h2><p><b>Objectif :</b> ${m.goal}</p><h3>Objectifs</h3><ul>${m.objectives.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Le cours</h3>${m.lessons.map(x=>`<div class="notice" style="margin:9px 0">${x}</div>`).join('')}<h3>Exercice</h3><div class="notice">${m.exercise}</div><h3>Action</h3><div class="notice">${m.action}</div><a class="btn" href="tests.html?module=${m.id}">📝 Tester ce module</a></div></div>`)};filter.oninput=render;render();closeShell()})();
</script></body></html>
