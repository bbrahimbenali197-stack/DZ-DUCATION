<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progression — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>
(async()=>{const x=await requireAccess();if(!x)return;shell('progression');await fillUser();const [m,r,f]=await Promise.all([sb.from('mission_progress').select('*').eq('user_id',x.u.id).eq('done',true),sb.from('test_results').select('*').eq('user_id',x.u.id).order('created_at',{ascending:false}),sb.from('favorites').select('*').eq('user_id',x.u.id)]);const n=m.data?.length||0;document.querySelector('.main').innerHTML+=`<h1>📈 Ma progression</h1><div class="grid"><div class="card"><div class="kpi">${Math.round(n/28*100)}%</div><p class="muted">Missions terminées</p><div class="progress"><span style="width:${n/28*100}%"></span></div></div><div class="card"><div class="kpi">${r.data?.length||0}</div><p class="muted">Tests enregistrés</p></div><div class="card"><div class="kpi">${f.data?.length||0}</div><p class="muted">Favoris</p></div></div><section id="badges" class="section"><h2>🏆 Badges & Récompenses</h2><div class="grid"><div class="card"><h3>🌱 Départ</h3><p>Compte activé.</p></div><div class="card"><h3>📚 Apprenant</h3><p>${n>=7?'Débloqué':'7 missions nécessaires'}</p></div><div class="card"><h3>🔥 Régulier</h3><p>${n>=14?'Débloqué':'14 missions nécessaires'}</p></div><div class="card"><h3>🚀 Avancé</h3><p>${n>=28?'Débloqué':'28 missions nécessaires'}</p></div></div></section><section id="favoris" class="section"><h2>❤️ Favoris</h2><div class="card"><p class="muted">Les favoris des modules peuvent être ajoutés dans la prochaine version synchronisée.</p></div></section>`;closeShell()})();
</script></body></html>
