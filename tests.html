<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tests — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="data.js"></script></head><body><script>
(async()=>{if(!await requireAccess())return;shell('tests');await fillUser();document.querySelector('.main').insertAdjacentHTML('beforeend',`<div class="section-head"><div><h1>📝 160 tests interactifs</h1><p class="muted">140 questions des modules + 20 questions d'examen final.</p></div></div><div class="card" id="quiz"><button class="btn" onclick="start()">Commencer</button></div>`);let qs=DZ_QUESTIONS.slice(0,160),i=0,score=0;function start(){i=0;score=0;show()}function show(){const q=qs[i];quiz.innerHTML=`<span class="badge">Question ${i+1}/160</span><h2>${q.q}</h2>${q.opts.map((o,j)=>`<label class="quiz-option"><input type="radio" name="a" value="${j}"> ${o}</label>`).join('')}<button class="btn" onclick="answer()">Valider</button><div class="progress" style="margin-top:16px"><span style="width:${i/160*100}%"></span></div>`}window.answer=()=>{const a=document.querySelector('input[name=a]:checked');if(!a){toast('Choisissez une réponse.');return}if(+a.value===qs[i].ans)score++;i++;if(i>=qs.length){const pct=Math.round(score/qs.length*100);quiz.innerHTML=`<h2>🎉 Test terminé</h2><p>Score : <b>${pct}%</b></p><a class="btn" href="progression.html">Voir ma progression</a>`;saveQuiz(pct);return}show()};async function saveQuiz(pct){const u=await user();await sb.from('test_results').insert({user_id:u.id,score:pct,label:'Test DIGITAL DZ',total:160})}closeShell()})();
</script></body></html>
