<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — DIGITAL DZ</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>
(async()=>{const x=await requireAccess();if(!x)return;shell('profile');await fillUser();document.querySelector('.main').insertAdjacentHTML('beforeend',`<h1>👤 Mon profil</h1><div class="card form"><label>Nom et prénom<input class="input" id="name" value="${(x.p.full_name||'').replace(/"/g,'&quot;')}"></label><label>Adresse e-mail<input class="input" value="${x.u.email}" disabled></label><label>Code d'accès PVC<input class="input" value="••••••••" disabled></label><button class="btn" onclick="save()">Enregistrer</button><div id="res"></div></div>`);window.save=async()=>{const {error}=await sb.from('client_profiles').update({full_name:name.value.trim()}).eq('id',x.u.id);res.innerHTML=error?'<div class="notice">❌ '+error.message+'</div>':'<div class="notice">✅ Profil enregistré.</div>'};closeShell()})();
</script></body></html>
